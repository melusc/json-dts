name: Publish Package to npmjs
on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@26.13.0
      - run: pnpm build
      - name: Ensure clean working tree
        run: git --no-pager diff --exit-code
      - run: pnpm clean-package -- ava packageManager devDependencies scripts
      - run: pnpm stage publish --access public --provenance --no-git-checks
